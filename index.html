<!DOCTYPE html>
<html>
<head>
    <title>Event Attendance Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 450px; margin: auto; background-color: #f8f9fa; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 0.9em; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-size: 1em; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        #status { font-size: 0.85em; text-align: center; margin-top: 10px; font-weight: bold; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Attendance</h2>
        <p id="status" class="success">✅ Ready for check-in</p>
        
        <form id="attendanceForm">
            <label>Full Name</label>
            <input type="text" name="name" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" required>

            <label>Email Address</label>
            <input type="email" name="email" required>

            <label>Branch/Campus/Department</label>
            <input type="text" name="branch" required>

            <label>Role</label>
            <select name="role" required>
                <option value="Staff">Staff</option>
                <option value="Trainer">Trainer</option>
            </select>

            <label>Training Type</label>
            <select name="training" required>
                <option value="FM">FM (Fire Marshal)</option>
                <option value="FA">FA (First Aid)</option>
            </select>

            <button type="submit" id="submitBtn">Check-in Now</button>
        </form>
    </div>

<script>
const form = document.getElementById('attendanceForm');
const submitBtn = document.getElementById('submitBtn');

// 🔁 Replace with your production webhook URL
const WEBHOOK_URL = "http://0.0.0.0:5678/webhook/submit-attendance";

// 🔐 Secret key (must match n8n validation)
const SECRET_KEY = "6gatau7868ukjauytr5";

form.onsubmit = async (e) => {
    e.preventDefault();
    submitBtn.innerText = "Processing...";
    submitBtn.disabled = true;

    const data = Object.fromEntries(new FormData(e.target).entries());

    try {
        const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'x-api-key': SECRET_KEY
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert("Success! Your attendance has been recorded.");
            form.reset();
        } else {
            alert("Unauthorized or submission failed.");
        }
    } catch (err) {
        alert("Network error.");
    } finally {
            submitBtn.innerText = "Check-in Now";
            submitBtn.disabled = false;
    }
};
</script>
</body>
</html>
